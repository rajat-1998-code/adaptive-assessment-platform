{% extends "base.html" %}

{% block content %}
<p style="margin:0 0 16px; font-size:16px; line-height:1.7; color:#223548;">
  Use the verification code below to confirm your email address. This code expires in
  <strong>{{ otp_expiry_minutes }} minutes</strong>.
</p>
<div style="margin:0 0 24px; padding:18px 20px; background:#f3f7fb; border:1px dashed #9bb7cf; border-radius:16px; text-align:center;">
  <span style="font-size:32px; letter-spacing:0.3em; font-weight:700; color:#102033;">
    {{ otp_code }}
  </span>
</div>
<p style="margin:0; font-size:14px; line-height:1.7; color:#5c7085;">
  If you did not request this code, you can safely ignore this email.
</p>
{% endblock %}
