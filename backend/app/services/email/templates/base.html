<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f3f7fb; color:#102033; font-family:Segoe UI, Arial, sans-serif;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      {{ preheader }}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7fb; padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px; background:#ffffff; border-radius:20px; overflow:hidden;">
            <tr>
              <td style="padding:28px 32px; background:linear-gradient(135deg, #0f4c81, #2f7f66); color:#ffffff;">
                <p style="margin:0; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;">
                  {{ app_name }}
                </p>
                <h1 style="margin:14px 0 0; font-size:28px; line-height:1.2;">
                  {{ headline }}
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px; font-size:16px; line-height:1.7;">
                  Hi {{ recipient_name }},
                </p>
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px; border-top:1px solid #e5edf5; color:#5c7085; font-size:13px; line-height:1.6;">
                <p style="margin:0 0 8px;">
                  Need help? Reply to this email or reach us at {{ support_email }}.
                </p>
                <p style="margin:0;">
                  Local testing inbox: <a href="{{ mailhog_ui_url }}" style="color:#0f4c81;">{{ mailhog_ui_url }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
